; e32l7wdisplay - ESP32-S3 7" 800x480 weather display
; Tasmota 8MB-compatible partition layout + safeboot stub

[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf

; DIO only
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_upload.flash_size = 8MB

board_build.psram = enable
board_build.psram_mode = opi

board_build.partitions = partitions.csv
board_build.app_partition_name = app0

monitor_speed = 115200

build_flags =
    -I.
    -Isrc/include
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DBOARD_CPU_MHZ=240
    -DBOARD_PSRAM_MHZ=80
    -DCONFIG_SPIRAM_SPEED=80
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_TINY_TTF=1
    -std=gnu++17
    -Wno-error=missing-field-initializers

[env:esp32-s3]
; main application -> app0 (ota_0)
extra_scripts = extra_script.py
board_build.cmake_extra_args =
    -DPIOENV=esp32-s3

build_flags =
    ${env.build_flags}
    -include esp_panel_board_custom_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_TINY_TTF=1

[env:safeboot]
; minimal OTA recovery stub -> factory partition (@0x10000)
extra_scripts = extra_script.py
board_build.app_partition_name = safeboot
# SDKCONFIG_DEFAULTS as a file list (last wins): the stub really builds
# lean this way (BT off, ...). Paths are project-root relative. NOTE:
# PlatformIO does not watch the overlay for CMake reconfigure - after
# editing sdkconfig.defaults.safeboot run `pio run -e safeboot -t clean`.
board_build.cmake_extra_args =
    -DPIOENV=safeboot
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.safeboot

build_flags =
    ${env.build_flags}